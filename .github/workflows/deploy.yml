name: Django CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: docdrop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/docdrop_test
      DEBUG: "False"
      SECRET_KEY: "dummy-secret-key-for-ci"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Debug Project Structure
        run: |
          pwd
          ls -la
          find . -name "requirements.txt"
          find . -name "manage.py"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r $(find . -name "requirements.txt" | head -n 1)
      - name: Run migrations
        run: |
          python $(find . -name "manage.py" | head -n 1) migrate --noinput
      - name: Run tests
        run: |
          python $(find . -name "manage.py" | head -n 1) test

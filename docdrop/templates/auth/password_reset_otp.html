{% extends 'base/base.html' %}

{% block title %}Verify OTP - DocDrop{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-shield-lock text-success" style="font-size: 3rem;"></i>
                    <h2 class="mt-3">Verify OTP</h2>
                    <p class="text-muted">Enter the OTP sent to your email</p>
                </div>

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>

                    <div class="mb-3">
                        <label for="otp" class="form-label">OTP Code</label>
                        <input type="text" class="form-control text-center" id="otp" name="otp" required maxlength="6"
                            placeholder="Enter 6-digit OTP"
                            style="font-size: 24px; letter-spacing: 5px; font-family: monospace;">
                        <small class="text-muted">Check your email for the OTP (valid for 10 minutes)</small>
                    </div>

                    <div class="mb-3">
                        <label for="new_password" class="form-label">New Password</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="new_password" name="new_password" required
                                minlength="8">
                            <button class="btn btn-outline-secondary" type="button" id="toggleNewPassword">
                                <i class="bi bi-eye" id="toggleNewIcon"></i>
                            </button>
                        </div>
                        <small class="text-muted">Minimum 8 characters</small>
                    </div>

                    <div class="mb-4">
                        <label for="confirm_password" class="form-label">Confirm New Password</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                                required minlength="8">
                            <button class="btn btn-outline-secondary" type="button" id="toggleConfirmPassword">
                                <i class="bi bi-eye" id="toggleConfirmIcon"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success w-100 mb-3">
                        <i class="bi bi-check-circle"></i> Reset Password
                    </button>
                </form>

                <div class="text-center">
                    <a href="{% url 'accounts:password_reset_request' %}" class="text-decoration-none">
                        Didn't receive OTP? Request again
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Password visibility toggles
    document.getElementById('toggleNewPassword').addEventListener('click', function () {
        const password = document.getElementById('new_password');
        const icon = document.getElementById('toggleNewIcon');
        if (password.type === 'password') {
            password.type = 'text';
            icon.classList.remove('bi-eye');
            icon.classList.add('bi-eye-slash');
        } else {
            password.type = 'password';
            icon.classList.remove('bi-eye-slash');
            icon.classList.add('bi-eye');
        }
    });

    document.getElementById('toggleConfirmPassword').addEventListener('click', function () {
        const password = document.getElementById('confirm_password');
        const icon = document.getElementById('toggleConfirmIcon');
        if (password.type === 'password') {
            password.type = 'text';
            icon.classList.remove('bi-eye');
            icon.classList.add('bi-eye-slash');
        } else {
            password.type = 'password';
            icon.classList.remove('bi-eye-slash');
            icon.classList.add('bi-eye');
        }
    });
</script>
{% endblock %}

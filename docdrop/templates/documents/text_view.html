{% extends 'base/base.html' %}

{% block title %}View Text - {{ document.document_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0"><i class="bi bi-file-text"></i> Extracted Text</h4>
                <div>
                    <button class="btn btn-sm btn-light" onclick="copyToClipboard()">
                        <i class="bi bi-clipboard"></i> Copy
                    </button>
                    <a href="{% url 'documents:list' %}" class="btn btn-sm btn-outline-light">Back</a>
                </div>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <strong>Document:</strong> {{ document.document_name }}
                </div>
                <hr>
                <div class="p-3 bg-light border rounded" style="white-space: pre-wrap;" id="extractedText">{{
                    document.extracted_text|default:"No text extracted." }}</div>
            </div>
        </div>
    </div>
</div>

<script>
    function copyToClipboard() {
        const text = document.getElementById('extractedText').innerText;
        navigator.clipboard.writeText(text).then(() => {
            alert('Text copied to clipboard!');
        }).catch(err => {
            console.error('Failed to copy: ', err);
        });
    }
</script>
{% endblock %}

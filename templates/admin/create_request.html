{% extends 'base/base.html' %}

{% block title %}Request Document - DocDrop{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow border-warning">
            <div class="card-header bg-warning text-dark">
                <h4 class="mb-0"><i class="bi bi-file-earmark-plus"></i> Request Document</h4>
            </div>
            <div class="card-body">
                <p>Sending a request to: <strong>{{ client.get_full_name|default:client.username }}</strong> ({{
                    client.email }})</p>

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="title" class="form-label">Document Title / Type *</label>
                        <input type="text" class="form-control" id="title" name="title"
                            placeholder="e.g. Pan Card Scan, Rental Agreement" required>
                        <small class="text-muted">Be specific about what you need.</small>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Instructions (Optional)</label>
                        <textarea class="form-control" id="description" name="description" rows="3"
                            placeholder="Add any specific instructions for the client..."></textarea>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-warning">
                            <i class="bi bi-send"></i> Send Request
                        </button>
                        <a href="{% url 'accounts:user_detail' client.id %}" class="btn btn-outline-secondary">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

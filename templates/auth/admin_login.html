{% extends 'base/base.html' %}

{% block title %}Admin Login - DocDrop{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow border-primary">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-shield-check text-primary" style="font-size: 3rem;"></i>
                    <h2 class="mt-3">Admin Login</h2>
                    <p class="text-muted">DocDrop Administration Portal</p>
                </div>

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="username" class="form-label">
                            <i class="bi bi-person"></i> Email Address
                        </label>
                        <input type="text" class="form-control" id="username" name="username" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">
                            <i class="bi bi-lock"></i> Password
                        </label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="remember">
                        <label class="form-check-label" for="remember">Remember me</label>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 mb-3">
                        <i class="bi bi-box-arrow-in-right"></i> Login as Admin
                    </button>
                </form>

                <div class="text-center">
                    <a href="{% url 'accounts:password_reset' %}" class="text-decoration-none">
                        <i class="bi bi-question-circle"></i> Forgot Password?
                    </a>
                    <br>
                    <a href="{% url 'accounts:user_login' %}" class="text-decoration-none mt-2 d-block">
                        <i class="bi bi-person"></i> Login as User Instead
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

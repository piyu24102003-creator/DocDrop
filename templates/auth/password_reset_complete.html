{% extends 'base/base.html' %}

{% block title %}Password Reset Complete - DocDrop{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow">
            <div class="card-body p-5 text-center">
                <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
                <h2 class="mt-3">Password Reset Complete</h2>
                <p class="text-muted">Your password has been successfully reset.</p>
                <a href="{% url 'accounts:user_login' %}" class="btn btn-primary">
                    <i class="bi bi-box-arrow-in-right"></i> Login Now
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

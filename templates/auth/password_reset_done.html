{% extends 'base/base.html' %}

{% block title %}Password Reset Sent - DocDrop{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow">
            <div class="card-body p-5 text-center">
                <i class="bi bi-check-circle text-success" style="font-size: 4rem;"></i>
                <h2 class="mt-3">Check Your Email</h2>
                <p class="text-muted">We've sent password reset instructions to your email address.</p>
                <a href="{% url 'accounts:user_login' %}" class="btn btn-primary">
                    <i class="bi bi-arrow-left"></i> Back to Login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'base/base.html' %}

{% block title %}Forgot Password - DocDrop{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-key text-warning" style="font-size: 3rem;"></i>
                    <h2 class="mt-3">Change Password</h2>
                    <p class="text-muted">Enter your email to receive an OTP for verification</p>
                </div>

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" required
                            placeholder="Enter your registered email">
                    </div>

                    <button type="submit" class="btn btn-warning w-100 mb-3">
                        <i class="bi bi-send"></i> Send OTP
                    </button>
                </form>

                <div class="text-center">
                    <a href="{% url 'accounts:user_login' %}" class="text-decoration-none">
                        <i class="bi bi-arrow-left"></i> Back to Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'base/base.html' %}

{% block title %}Register Owner - DocDrop{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow border-primary">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-person-badge text-primary" style="font-size: 3rem;"></i>
                    <h2 class="mt-3">Owner Registration</h2>
                    <p class="text-muted">Create your DocDrop management account</p>
                </div>

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address (will be username)</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>

                    <div class="mb-3">
                        <label for="phone" class="form-label">Contact Number</label>
                        <input type="tel" class="form-control" id="phone" name="phone" required>
                    </div>

                    <div class="mb-3">
                        <label for="designation" class="form-label">Designation / Type</label>
                        <select class="form-select" id="designation" name="designation" required>
                            <option value="">Select Designation...</option>
                            <option value="Business">Business</option>
                            <option value="Startup">Startup</option>
                            <option value="Student">Student (Project Manager)</option>
                            <option value="Freelancer">Freelancer</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 mb-3">
                        <i class="bi bi-check-circle"></i> Register
                    </button>
                </form>

                <div class="text-center">
                    <a href="{% url 'accounts:admin_login' %}" class="text-decoration-none">
                        Already have an account? Login here
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
